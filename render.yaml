services:
  - type: web
    name: jerseydrop
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn jerseydrop.wsgi --workers 2 --threads 4 --timeout 60"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: jerseydrop-db
          property: connectionString
      - key: DATABASE_SSL
        value: "True"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  - name: jerseydrop-db
    databaseName: jerseydrop
    user: jerseydrop
    plan: free
